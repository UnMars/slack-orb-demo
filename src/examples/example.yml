description: >
  Example usage of the Slack notification orb showing how to send targeted
  notifications to specific people, teams, or channels with custom messages.

version: 2.1

usage:
  version: 2.1
  orbs:
    notification: unmars/slack-orb-demo@dev:alpha
  workflows:
    example:
      jobs:
      # Simple notification
      - notification/notify:
          channel: "#devops"
          message: "✅ Deployment to production completed successfully! 🚀"
          filters:
            branches:
              only: main

      # Another notification
      - notification/notify:
          channel: "#general"
          message: "New feature deployed to staging! 🎉"

      # Notification with custom message
      - notification/notify:
          channel: "#alerts"
          message: "Database migration completed successfully"
