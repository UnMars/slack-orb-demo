description: >
  Example usage of the Slack notification orb showing how to send targeted
  notifications to specific people, teams, or channels with custom messages.

version: 2.1

usage:
  version: 2.1
  orbs:
    notification: unmars/slack-orb-demo@dev:alpha
  workflows:
    example:
      jobs:
      # Success notification
      - notification/notify_success:
          channel: "#devops"
          message: "✅ Deployment to production completed successfully! 🚀"
          mention: "@devops-team"
          filters:
            branches:
              only: main

      # Failure notification
      - notification/notify_failure:
          channel: "#devops"
          message: "❌ Build failed on branch $CIRCLE_BRANCH"
          mention: "@here"
          when: on_fail

      # Custom notification
      - notification/notify_custom:
          channel: "#general"
          message: "New feature deployed to staging! 🎉"
          status: "info"
          mention: "@devops-team @qa-team"

      # Custom success notification
      - notification/notify_custom:
          channel: "#alerts"
          message: "Database migration completed successfully"
          status: "success"
          mention: "@dba-team"

      # Using commands directly in jobs
      - build:
          steps:
            - run: echo "Building..."
            - notification/notify_success:
                channel: "#builds"
                message: "Build completed successfully!"