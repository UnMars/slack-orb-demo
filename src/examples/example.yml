description: >
  Example usage of the Slack notification orb showing how to send targeted
  notifications to specific people, teams, and channels with custom messages.

version: 2.1

usage:
  version: 2.1
  orbs:
    notification: unmars/slack-orb-demo@dev:alpha
  workflows:
    example:
      jobs:
      # Notify specific person
      - notification/slack:
          target: "@guillaume"
          message: "Your deployment to production completed successfully! 🚀"
          status: "success"
          mention: "@devops-team"
          filters:
            branches:
              only: main
      
      # Notify team channel
      - notification/slack:
          target: "#devops"
          message: "Build failed on branch $CIRCLE_BRANCH"
          status: "failure"
          mention: "@here"
          when: on_fail
      
      # Notify everyone
      - notification/slack:
          target: "@here"
          message: "New feature deployed to staging! 🎉"
          status: "info"
          mention: "@devops-team @qa-team"
      
      # Notify specific channel with custom message
      - notification/slack:
          target: "#alerts"
          message: "Database migration completed successfully"
          status: "success"
          mention: "@dba-team"
      
      # Use the job for multiple notifications
      - notification/notify:
          target: "#general"
          message: "Weekly deployment completed! 🚀"
          status: "success"
          mention: "@everyone"