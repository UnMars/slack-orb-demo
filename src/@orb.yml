version: 2.1

description: >
  A simple and powerful Slack notification orb for CircleCI. Send targeted
  notifications to specific people, teams, or channels with customizable
  messages and build status.

display:
  home_url: "https://github.com/UnMars/slack-orb-demo"
  source_url: "https://github.com/UnMars/slack-orb-demo"

orbs:
  slack: circleci/slack@5.2.3

executors:
  default:
    docker:
      - image: cimg/base:current

commands:
  slack:
    parameters:
      channel:
        type: string
        description: "Slack channel to send message to (e.g., #general, @username)"
        default: $SLACK_DEFAULT_CHANNEL
      message:
        type: string
        description: "Custom message to send"
        default: "Build completed!"
      status:
        type: string
        description: "Build status (success, failure, warning, info)"
        default: "success"
      mention:
        type: string
        description: "Additional mentions (e.g., @devops-team @manager)"
        default: ""
    steps:
      - run:
          name: Determine emoji and color based on status
          command: |
            case "<< parameters.status >>" in
              "success")
                EMOJI="✅"
                COLOR="good"
                ;;
              "failure")
                EMOJI="❌"
                COLOR="danger"
                ;;
              "warning")
                EMOJI="⚠️"
                COLOR="warning"
                ;;
              "info")
                EMOJI="ℹ️"
                COLOR="#36a64f"
                ;;
              *)
                EMOJI="📢"
                COLOR="#36a64f"
                ;;
            esac

            # Build mention string
            MENTION_STRING=""
            if [ -n "<< parameters.mention >>" ]; then
              MENTION_STRING="<< parameters.mention >> "
            fi

            # Create message with emoji and mentions
            FULL_MESSAGE="${MENTION_STRING}${EMOJI} << parameters.message >>"

            # Export variables for next step
            echo "export EMOJI='$EMOJI'" >> $BASH_ENV
            echo "export COLOR='$COLOR'" >> $BASH_ENV
            echo "export FULL_MESSAGE='$FULL_MESSAGE'" >> $BASH_ENV
            echo "export MENTION_STRING='$MENTION_STRING'" >> $BASH_ENV

      - slack/notify:
          event: always
          custom: |
            {
              "channel": "<< parameters.channel >>",
              "text": "${FULL_MESSAGE}",
              "attachments": [
                {
                  "color": "$COLOR",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "<< parameters.status >>",
                      "short": true
                    },
                    {
                      "title": "Project",
                      "value": "$CIRCLE_PROJECT_REPONAME",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "$CIRCLE_BRANCH",
                      "short": true
                    },
                    {
                      "title": "Build",
                      "value": "<$CIRCLE_BUILD_URL|#$CIRCLE_BUILD_NUM>",
                      "short": true
                    }
                  ],
                  "footer": "CircleCI",
                  "ts": $(date +%s)
                }
              ]
            }

jobs:
  notify:
    description: >
      Send targeted Slack notifications to specific people, teams, or channels
      with customizable messages and build status.
    parameters:
      channel:
        type: string
        description: "Slack channel to send message to (e.g., #general, @username)"
        default: $SLACK_DEFAULT_CHANNEL
      message:
        type: string
        description: "Custom message to send"
        default: "Build completed!"
      status:
        type: string
        description: "Build status (success, failure, warning, info)"
        default: "success"
      mention:
        type: string
        description: "Additional mentions (e.g., @devops-team @manager)"
        default: ""
    executor: default
    steps:
      - checkout
      - slack:
          channel: << parameters.channel >>
          message: << parameters.message >>
          status: << parameters.status >>
          mention: << parameters.mention >>
