description: >
  Send a targeted notification to Slack with customizable message, status,
  and recipient (person, team, or channel).

parameters:
  target:
    type: string
    description: "Target recipient: @username, @channel, #channel, or @here"
    default: "#general"

  message:
    type: string
    description: "Custom message to send"
    default: "Build completed!"

  status:
    type: string
    description: "Build status (success, failure, warning, info)"
    default: "success"

  webhook_url:
    type: string
    description: "Slack webhook URL"
    default: $SLACK_WEBHOOK_URL

  mention:
    type: string
    description: "Additional mentions (e.g., @devops-team @manager)"
    default: ""

steps:
  - run:
      name: Send targeted Slack notification
      command: |
        chmod +x /tmp/notify.sh
        /tmp/notify.sh "$1" "$2" "$3" "$4" "$5"
      environment:
        STATUS: << parameters.status >>
        TARGET: << parameters.target >>
        MESSAGE: << parameters.message >>
        MENTION: << parameters.mention >>
        WEBHOOK: << parameters.webhook_url >>
