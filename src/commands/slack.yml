description: >
  Send a targeted notification to Slack with customizable message, status,
  and recipient (person, team, or channel).

parameters:
  channel:
    type: string
    description: "Slack channel to send message to (e.g., #general, @username)"
    default: $SLACK_DEFAULT_CHANNEL

  message:
    type: string
    description: "Custom message to send"
    default: "Build completed!"

  status:
    type: string
    description: "Build status (success, failure, warning, info)"
    default: "success"

  mention:
    type: string
    description: "Additional mentions (e.g., @devops-team @manager)"
    default: ""

steps:
  - run:
      name: Determine emoji and color based on status
      command: |
        case "<< parameters.status >>" in
          "success")
            EMOJI="✅"
            COLOR="good"
            ;;
          "failure")
            EMOJI="❌"
            COLOR="danger"
            ;;
          "warning")
            EMOJI="⚠️"
            COLOR="warning"
            ;;
          "info")
            EMOJI="ℹ️"
            COLOR="#36a64f"
            ;;
          *)
            EMOJI="📢"
            COLOR="#36a64f"
            ;;
        esac

        # Build mention string
        MENTION_STRING=""
        if [ -n "<< parameters.mention >>" ]; then
          MENTION_STRING="<< parameters.mention >> "
        fi

        # Create message with emoji and mentions
        FULL_MESSAGE="${MENTION_STRING}${EMOJI} << parameters.message >>"

        # Export variables for next step
        echo "export EMOJI='$EMOJI'" >> $BASH_ENV
        echo "export COLOR='$COLOR'" >> $BASH_ENV
        echo "export FULL_MESSAGE='$FULL_MESSAGE'" >> $BASH_ENV
        echo "export MENTION_STRING='$MENTION_STRING'" >> $BASH_ENV

  - slack/notify:
      channel: << parameters.channel >>
      message: |
        ${FULL_MESSAGE}

        *Status:* << parameters.status >>
        *Project:* $CIRCLE_PROJECT_REPONAME
        *Branch:* $CIRCLE_BRANCH
        *Build:* <$CIRCLE_BUILD_URL|#$CIRCLE_BUILD_NUM>
      color: $COLOR
